<!DOCTYPE html>
<html lang="es" class="light">
<head>

    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --background: #f8fafc;
            --foreground: #0f172a;
            --card: #ffffff;
            --border: #e2e8f0;
            --muted-foreground: #64748b;
            --primary: #3b82f6;
            --primary-foreground: #ffffff;
        }
        body {
            background-color: var(--background);
            color: var(--foreground);
        }
        .blank-input {
            width: 100px;
            border-bottom: 2px solid var(--primary);
            background: transparent;
            text-align: center;
            outline: none;
            color: var(--primary);
            font-weight: bold;
        }
        #sidebar { transition: transform 0.3s ease-in-out; }
        .fade-out { animation: fadeOut 1s ease-in-out forwards; }
        @keyframes fadeOut {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }
        #transition-screen {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }
        .code-example {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
        }
        .code-example.open {
            max-height: 800px; 
            opacity: 1;
        }
        .theory-expansion {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
        }
        .theory-expansion.open {
            max-height: 1000px;
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col md:flex-row overflow-hidden relative">

    <div id="transition-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center hidden opacity-100">
        <i class="fa-brands fa-python text-7xl mb-6 drop-shadow-lg"></i>
        <h1 id="transition-module" class="text-3xl md:text-5xl font-bold mb-4 text-center px-4 drop-shadow-md"></h1>
        <h2 id="transition-level" class="text-xl md:text-3xl font-medium text-blue-100 drop-shadow-md"></h2>
    </div>

    <!-- COMPACT MOBILE HEADER -->
    <header class="md:hidden flex items-center justify-between p-2 bg-[var(--card)] border-b border-[var(--border)] z-20 shadow-sm">
        <div class="flex items-center gap-2">
            <button onclick="toggleSidebar()" class="text-[var(--foreground)] text-lg p-2 focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-base font-bold text-blue-500 flex items-center gap-1">
                <i class="fa-brands fa-python"></i> PyLingo
            </h1>
        </div>
        <div class="font-bold text-amber-500 flex items-center gap-1 text-sm mr-2">
            <i class="fa-solid fa-star"></i> <span id="xp-counter-mobile">0</span>
        </div>
    </header>

    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-[85vw] md:w-80 bg-indigo-950/85 backdrop-blur-md border-r border-indigo-800 flex flex-col h-full shadow-2xl md:shadow-lg z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-5 flex justify-between items-center md:hidden border-b border-indigo-800">
            <span class="font-bold text-xl text-white tracking-wide">Módulos</span>
            <button onclick="toggleSidebar()" class="text-3xl text-indigo-300 hover:text-white p-2 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5 border-b border-indigo-800 hidden md:block">
            <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-brands fa-python"></i> PyLingo
            </h1>
            <p class="text-indigo-200 text-xs mt-2 tracking-wider uppercase font-semibold">Ruta de Aprendizaje</p>
        </div>
        <div class="p-3 border-b border-indigo-800 hidden md:flex justify-between items-center bg-indigo-900/50 text-indigo-100">
            <span class="font-semibold text-sm">Experiencia:</span>
            <span id="xp-counter-desktop" class="text-amber-400 font-bold flex items-center gap-1 text-sm">
                <i class="fa-solid fa-star"></i> 0 XP
            </span>
        </div>
        <nav class="flex-1 overflow-y-auto py-2" id="lesson-nav"></nav>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

    <main class="flex-1 flex flex-col h-full relative bg-[var(--background)] overflow-hidden w-full">
        
        <header class="p-2 md:p-4 border-b border-[var(--border)] bg-[var(--card)] shadow-sm flex items-center justify-between">
            <h2 id="current-lesson-title" class="text-sm md:text-lg font-bold text-[var(--foreground)] truncate">Selecciona una lección</h2>
            <button onclick="goHome()" id="btn-home" class="hidden text-blue-500 font-bold bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-lg text-xs md:text-sm">
                Menú
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-3 md:p-6 pb-20 md:pb-6 relative flex flex-col" id="main-content">
            
            <div id="welcome-screen" class="max-w-2xl mx-auto text-center mt-10 px-4">
                <i class="fa-brands fa-python text-5xl text-blue-500 mb-4"></i>
                <h2 class="text-2xl font-bold mb-3">¡Bienvenido a PyLingo V5!</h2>
                <p class="text-sm text-[var(--muted-foreground)] mb-6">108 Ejercicios con ejemplos reales de código. ¡Comencemos!</p>
                
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
                    <button onclick="startLesson(-1)" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-full shadow-md transition-transform transform hover:scale-105">
                        <i class="fa-solid fa-seedling mr-2"></i> Empezar desde cero (Módulo 0)
                    </button>
                    <button onclick="startLesson(1)" class="w-full sm:w-auto bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full shadow-md transition-transform transform hover:scale-105">
                        <i class="fa-solid fa-forward mr-2"></i> Ya sé lo básico (Módulo 1)
                    </button>
                </div>

            </div>

            <div id="lesson-screen" class="max-w-3xl mx-auto w-full hidden flex-1 flex flex-col pb-10">

                <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 mb-4 shadow-sm">
                    <h3 class="text-sm font-bold mb-2 flex items-center gap-1"><i class="fa-solid fa-book-open text-blue-500"></i> Teoría</h3>
                    <div id="lesson-theory" class="text-xs md:text-sm text-[var(--foreground)] leading-relaxed mb-2"></div>
                    
                    <button id="btn-expand-theory" onclick="toggleTheory()" class="hidden text-xs text-blue-600 font-bold flex items-center gap-1 hover:underline mb-2">

                    <div id="theory-expanded-content" class="theory-expansion mt-2 bg-blue-50 p-3 rounded-lg text-xs md:text-sm text-[var(--foreground)] border border-blue-100 leading-relaxed"></div>
                </div>

                <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 pb-6 md:pb-4 shadow-sm relative flex-1 flex flex-col mb-4 md:mb-0">
                    <div class="flex justify-between items-center mb-3 border-b border-[var(--border)] pb-2">
                        <div class="flex items-center gap-2 md:gap-4">
                            <h3 class="text-sm md:text-base font-bold flex items-center gap-1 md:gap-2">
                                <i class="fa-solid fa-dumbbell text-purple-500"></i> Ejercicio <span id="exercise-number">1</span>
                            </h3>
                            <div class="flex items-center bg-gray-100 rounded-lg p-0.5 shadow-inner">

                                <button onclick="nextExercise()" class="text-gray-500 hover:text-blue-600 hover:bg-white rounded px-2 py-0.5 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>

                        </div>
                        <div class="text-xs font-semibold px-2 py-1 bg-blue-100 rounded-full text-blue-800 whitespace-nowrap flex-shrink-0">
                            <span id="progress-text">1 / 9</span>
                        </div>
                    </div>
                    
                    <div id="exercise-context" class="text-sm md:text-base mb-4 text-indigo-900 border-l-4 border-indigo-500 pl-3 pr-2 bg-indigo-50 py-3 font-semibold shadow-sm rounded-r-lg"></div>
                    <div id="exercise-question" class="text-sm md:text-base mb-4 font-medium leading-relaxed"></div>
                    
                    <div id="exercise-container" class="mb-4"></div>

                    <!-- HINTS & SKIP -->
                    <div id="hint-container" class="hidden mb-4 bg-yellow-50 border border-yellow-200 p-3 rounded-lg">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 gap-2">
                            <h4 class="font-bold text-yellow-800 text-xs flex items-center gap-1"><i class="fa-solid fa-lightbulb"></i> Pistas</h4>
                            <div class="flex gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                <button id="btn-skip" onclick="skipExercise()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded font-bold transition-colors">
                                    <i class="fa-solid fa-eye"></i> Ver Respuesta
                                </button>
                                <div class="flex flex-col items-center">
                                    <span class="text-[10px] text-yellow-700 font-bold mb-0.5" id="hint-counter">0/0</span>
                                    <button id="btn-next-hint" onclick="showNextHint()" class="text-xs bg-yellow-200 hover:bg-yellow-300 text-yellow-800 px-3 py-1.5 rounded font-bold transition-colors">
                                        Siguiente Pista
                                    </button>
                                </div>
                            </div>
                        </div>
                        <ul id="hint-list" class="list-disc pl-4 text-xs text-yellow-700 space-y-1"></ul>
                    </div>

                    <div class="flex-1"></div>

                    <!-- FEEDBACK BOX -->
                    <div id="feedback-box" class="hidden mb-4 p-4 rounded-xl font-medium flex items-start gap-3">
                        <i id="feedback-icon" class="mt-0.5 text-xl"></i>
                        <div class="w-full">
                            <div id="feedback-title" class="font-bold text-sm md:text-base mb-1"></div>
                            <div id="feedback-text" class="text-xs md:text-sm leading-relaxed"></div>
                        </div>
                    </div>

                    <!-- EXAMPLE ACCORDION -->
                    <div id="example-container" class="hidden mb-4">
                        <button onclick="toggleExample()" class="text-xs md:text-sm text-blue-600 font-bold flex items-center gap-1 hover:underline">
                            <i id="example-icon" class="fa-solid fa-chevron-down"></i> Ver ejemplo de código aplicable
                        </button>
                        <div id="demo-example" class="code-example mt-2 bg-gray-900 rounded-lg p-3 md:p-4 text-green-400 font-mono text-xs md:text-sm border border-gray-700 leading-relaxed whitespace-pre-wrap"></div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="flex flex-col md:flex-row gap-2 mt-4 mb-4 md:mb-0">
                        <button id="btn-check" onclick="checkAnswer()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-sm transition-colors">
                            Comprobar Respuesta
                        </button>
                        <button id="btn-continue" onclick="nextExercise()" class="hidden w-full bg-gray-900 text-white font-bold py-3 rounded-xl shadow-sm transition-colors">
                            Siguiente Ejercicio <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="completion-screen" class="hidden max-w-2xl mx-auto text-center mt-10 px-4">
                <i class="fa-solid fa-trophy text-6xl text-yellow-500 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">¡Nivel Completado!</h2>
                <p class="text-sm text-[var(--muted-foreground)] mb-6">Ganaste XP.</p>
                <div class="flex flex-col gap-3 max-w-sm mx-auto">
                    <button id="btn-next-lesson" onclick="goToNextLesson()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-full shadow-md text-sm">
                        <span id="next-lesson-text">Continuar</span> <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button onclick="goHome()" class="w-full bg-transparent text-[var(--muted-foreground)] font-bold py-2 rounded-full border border-[var(--border)] text-sm">
                        Volver al Menú
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const lessons = [
    {
        "id": -1,
        "moduleNum": 0,
        "moduleName": "Módulo 0: Primeros Pasos",
        "levelName": "Nivel 1: Hablando con Python",
        "title": "1. Tu primer programa",
        "theory": "En Python, usamos <code>print()</code> para hacer que la computadora nos hable.",
        "theory_expanded": "Python es un lenguaje de programación. Imagina que es un traductor entre tú y la computadora. La forma más básica de interactuar es pedirle que muestre un texto en la pantalla. Para eso usamos el comando <code>print()</code>, que significa 'imprimir' en inglés. El texto que queremos que diga debe ir entre comillas dentro de los paréntesis.<hr class='my-4 border-gray-200'><h3>Machete (Resumen):</h3><pre class='bg-gray-800 text-green-400 p-2 rounded mt-2 text-xs'># Mostrar en pantalla:\nprint(\"Texto\")\n\n# Hacer un comentario:\n# Esto es un comentario</pre>",
        "exercises": [
            {
                "type": "multiple_choice",
                "context": "¡Bienvenido a Python! Este es tu primer paso guiado.",
                "question": "Selecciona la opción que dice 'Continuar' para avanzar.",

                    "Continuar",

                    "Salir"
                ],
                "correct": 0,
                "exact_answer": "Continuar",
                "explanation": "¡Excelente! Has dado tu primer paso.",
                "example": "<code>print(\"Continuar\")</code><br><span class='text-gray-500'># Muestra el texto</span>",
                "hints": [
                    "Haz clic en Continuar.",
                    "Es la primera opción.",
                    "Dale sin miedo."
                ]
            },
            {
                "type": "fill_in",
                "context": "Vamos a hacer que la computadora diga Hola.",
                "question": "Completa con la palabra print: <code>{0}(\"Hola\")</code>",
                "code": "<code>{0}(\"Hola\")</code>",
                "answers": [
                    [
                        "print"
                    ]
                ],
                "exact_answer": "print(\"Hola\")",
                "explanation": "El comando print siempre se escribe en minúsculas.",
                "example": "<code>print(\"Hola\")</code>",
                "hints": [
                    "Escribe print en el recuadro.",
                    "Son 5 letras.",
                    "p-r-i-n-t"
                ]
            },
            {
                "type": "write_code",
                "context": "¡Es tu turno de escribirlo completo!",
                "question": "Escribe el comando para imprimir \"Hola Mundo\".",
                "exact_answer": "print(\"Hola Mundo\")",
                "explanation": "Siempre recuerda abrir y cerrar los paréntesis, y poner el texto entre comillas.",
                "example": "<code>print(\"Python\")</code>",
                "hints": [
                    "Escribe: <code>print(\"Hola Mundo\")</code>",
                    "Recuerda las comillas.",
                    "Recuerda los paréntesis."
                ]
            }
        ]
    },
    {
        "id": 0,
        "moduleNum": 0,
        "moduleName": "Módulo 0: Primeros Pasos",
        "levelName": "Nivel 2: Comentarios",
        "title": "2. Dejando notas",
        "theory": "Los comentarios son notas para humanos que la computadora ignora.",
        "theory_expanded": "A veces queremos dejar una explicación en nuestro código para acordarnos de qué hace. Usamos el símbolo de numeral <code>#</code> (hashtag). Todo lo que escribas después de ese símbolo en esa línea será invisible para Python. Además, Python siempre lee las líneas de arriba hacia abajo, una por una.<hr class='my-4 border-gray-200'><h3>Machete (Resumen):</h3><pre class='bg-gray-800 text-green-400 p-2 rounded mt-2 text-xs'># Mostrar en pantalla:\nprint(\"Texto\")\n\n# Hacer un comentario:\n# Esto es un comentario</pre>",

                    "/*",
                    "#"
                ],
                "correct": 2,
                "exact_answer": "#",
                "explanation": "En Python, se usa el símbolo <code>#</code> para los comentarios de una línea.",
                "example": "<code># Esto es una nota</code>",
                "hints": [
                    "Es el símbolo de numeral o hashtag.",
                    "Se usa mucho en redes sociales.",
                    "Es el tercero."
                ]
            },
            {
                "type": "fill_in",
                "context": "Comentemos un código para que no se ejecute.",

                "answers": [
                    [
                        "#"
                    ]
                ],
                "exact_answer": "#print(\"Secreto\")",
                "explanation": "Al poner el `#` al principio, toda la línea se convierte en texto ignorado.",
                "example": "<code># Código oculto</code>",

                    "Usa el hashtag <code>#</code>.",

            },
            {
                "type": "write_code",
                "context": "Escribe tu primer comentario.",

                "explanation": "Los comentarios son fundamentales para mantener el código legible.",
                "example": "<code># Saludo</code>",
                "hints": [

    {
        "id": 1,
        "moduleNum": 1,
        "moduleName": "Módulo 1: Variables y Tipos",
        "levelName": "Nivel 1: Básico",
        "title": "1. Introducción a Variables",
        "theory": "En Python, una variable es como una etiqueta que le ponemos a un dato para recordarlo.",
        "theory_expanded": "Imagina que las variables son como cajas con etiquetas. Si tienes el precio de un producto, en lugar de memorizar el número, lo guardas en una caja y le pones la etiqueta <code>precio</code>. Cuando necesites ese valor, simplemente llamas a la caja por su nombre. ¡Así de fácil es guardar información en programación!<hr class='my-4 border-gray-200'><h3>Machete (Resumen):</h3><pre class='bg-gray-800 text-green-400 p-2 rounded mt-2 text-xs'># Asignar variables:\nnombre = \"Ana\"\nedad = 25\nactivo = True\n\n# Actualizar/Suma corta:\npuntos += 5\n\n# Intercambiar:\na, b = b, a</pre>",
        "exercises": [
            {
                "type": "multiple_choice",
                "context": "En un sistema de ventas, necesitas guardar el nombre de un cliente.",

                    "nombre_cliente = \"Ana\"",
                    "\"Ana\" = nombre_cliente",
                    "nombre_cliente == \"Ana\""

                "correct": 0,
                "exact_answer": "nombre_cliente = \"Ana\"",
                "explanation": "El nombre de la variable (<code>nombre_cliente</code>) siempre va a la izquierda. Luego usamos un solo signo de igual <code>=</code> para asignar, y a la derecha el valor de texto entre comillas <code>\"Ana\"</code>.",

                "hints": [
                    "La variable siempre va a la izquierda del signo igual.",
                    "Para asignar un valor se usa un solo signo <code>=</code>.",
                    "El texto debe ir entre comillas."
                ]
            },
            {
                "type": "multiple_choice",
                "context": "Estás registrando el stock de zapatillas en una tienda.",
                "question": "¿Cómo guardas el número 50 en la variable <code>stock_zapatillas</code>?",

                "correct": 1,
                "exact_answer": "stock_zapatillas = 50",

                    "Evalúa con un condicional.",
                    "Es el <code>if</code>."
                ]
            },
            {
                "type": "write_code",
                "context": "El bucle while debe pedir el porcentaje y guardarlo como float.",
                "question": "Escribe el código para pedir la rentabilidad: asigna a <code>rentabilidad</code> un <code>float(input(\"Rentabilidad:\"))</code>.",
                "exact_answer": "rentabilidad = float(input(\"Rentabilidad:\"))",
                "explanation": "Queda: <code>rentabilidad = float(input(\"Rentabilidad:\"))</code>.",
                "example": "<code>r = float(input(\"?\"))</code>",
                "hints": [
                    "Empieza con la variable <code>rentabilidad</code>.",
                    "Usa <code>float()</code>.",
                    "Dentro va <code>input(\"Rentabilidad:\")</code>."
                ]
            },
            {
                "type": "write_code",
                "context": "Tenemos el algoritmo del máximo.",
                "question": "Escribe la condición IF para evaluar si <code>datos[\"ventas\"]</code> es estrictamente mayor que la variable <code>mayor_venta</code>.",
                "exact_answer": "if datos[\"ventas\"] > mayor_venta:",
                "explanation": "Se escribe: <code>if datos[\"ventas\"] > mayor_venta:</code>. Recuerda los dos puntos al final de la línea.",
                "example": "<code>if valor > tope:</code>",
                "hints": [
                    "Empieza con <code>if</code>.",
                    "Accede al diccionario con <code>datos[\"ventas\"]</code>.",
                    "Usa mayor que <code>></code>."
                ]
            },
            {
                "type": "write_code",
                "context": "Dentro de ese IF, actualizamos el récord del ganador.",
                "question": "Escribe la asignación donde guardamos <code>datos[\"ventas\"]</code> dentro de la variable <code>mayor_venta</code>.",
                "exact_answer": "mayor_venta = datos[\"ventas\"]",
                "explanation": "Para actualizar el récord, simplemente guardamos el nuevo valor más alto en nuestra variable de control: <code>mayor_venta = datos[\"ventas\"]</code>.",
                "example": "<code>tope = valor</code>",
                "hints": [
                    "La variable <code>mayor_venta</code> a la izquierda.",
                    "Usa <code>=</code>.",
                    "El valor es <code>datos[\"ventas\"]</code>."
                ]
            }
        ]
    }
];

        let currentLesson = null;
        let currentExerciseIndex = 0;
        let xp = 0;
        let hintsShown = 0;

        document.addEventListener('DOMContentLoaded', () => { renderNav(); });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        
        function renderNav() {
            const nav = document.getElementById('lesson-nav');
            nav.innerHTML = '';
            
            const modules = {};
            lessons.forEach(l => {
                if(!modules[l.moduleName]) modules[l.moduleName] = [];
                modules[l.moduleName].push(l);
            });
            
            const modEntries = Object.entries(modules);
            modEntries.forEach(([modName, modLessons], index) => {
                const modWrapper = document.createElement('div');
                modWrapper.className = "mb-0"; // No extra margin, sober boxes
                
                const header = document.createElement('button');
                header.className = "w-full text-left px-5 py-4 flex items-center justify-between text-white font-semibold transition-colors focus:outline-none hover:bg-indigo-800/40";
                
                // Keep the active module expanded by default
                let isActiveModule = modLessons.some(l => l.id === currentLesson?.id);
                
                header.innerHTML = `<span class="tracking-wide">${modName}</span> <i class="fa-solid fa-chevron-down text-sm text-indigo-400 transition-transform duration-300 ${isActiveModule ? 'rotate-180' : ''}"></i>`;
                
                const levelsContainer = document.createElement('div');
                levelsContainer.className = "overflow-hidden transition-all duration-300 ease-in-out bg-indigo-950/60";
                levelsContainer.style.maxHeight = isActiveModule ? '1000px' : '0px';
                
                header.onclick = () => {
                    const icon = header.querySelector('i');
                    if (levelsContainer.style.maxHeight !== '0px') {
                        levelsContainer.style.maxHeight = '0px';
                        icon.classList.remove('rotate-180');
                    } else {
                        levelsContainer.style.maxHeight = '1000px';
                        icon.classList.add('rotate-180');
                    }
                };
                
                modLessons.forEach(lesson => {
                    const btn = document.createElement('button');
                    const isActive = lesson.id === currentLesson?.id;
                    btn.className = `w-full text-left pl-8 pr-5 py-3 flex items-center justify-between text-sm transition-colors border-l-2 ${isActive ? 'border-indigo-400 text-indigo-100 font-bold bg-indigo-800/40' : 'border-transparent text-indigo-300 hover:text-white hover:bg-indigo-800/20 hover:border-indigo-600'}`;
                    btn.onclick = () => {
                        if(window.innerWidth < 768) toggleSidebar();
                        startLesson(lesson.id);
                    };
                    btn.innerHTML = `<span class="truncate">${lesson.levelName || lesson.title}</span>`;
                    levelsContainer.appendChild(btn);
                });
                
                modWrapper.appendChild(header);
                modWrapper.appendChild(levelsContainer);
                nav.appendChild(modWrapper);
                
                // Thin line divider taking 90%
                if (index < modEntries.length - 1) {
                    const divider = document.createElement('div');
                    divider.className = "w-[90%] mx-auto border-b border-indigo-800/60 my-1";
                    nav.appendChild(divider);
                }
            });
        }
        
        function loadExercise() {
            hintsShown = 0;
            const ex = currentLesson.exercises[currentExerciseIndex];
            document.getElementById('exercise-number').innerText = (currentExerciseIndex + 1);
            document.getElementById('progress-text').innerText = `${currentExerciseIndex + 1} / ${currentLesson.exercises.length}`;
            
            const contextBox = document.getElementById('exercise-context');
            if (ex.context) {
                contextBox.innerHTML = `<b>Contexto:</b> ${ex.context}`;
                contextBox.classList.remove('hidden');
            } else {
                contextBox.classList.add('hidden');
            }
            
            document.getElementById('exercise-question').innerHTML = ex.question.replace(/\{\d+\}/g, '<span class="bg-gray-200 text-gray-200 px-3 py-0.5 rounded mx-1 inline-block text-xs select-none shadow-inner">_</span>');
            const container = document.getElementById('exercise-container');
            container.innerHTML = '';
            
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('example-container').classList.add('hidden');
            document.getElementById('demo-example').classList.remove('open');
            document.getElementById('example-icon').className = 'fa-solid fa-chevron-down';
            document.getElementById('btn-continue').classList.add('hidden');
            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('btn-check').disabled = false;
            
            // Hint system setup
            if (ex.hints && ex.hints.length > 0) {
                document.getElementById('hint-container').classList.remove('hidden');
                document.getElementById('hint-list').innerHTML = '';
                document.getElementById('btn-next-hint').classList.remove('hidden');
                document.getElementById('hint-counter').innerText = `0/${ex.hints.length}`;
            } else {
                document.getElementById('hint-container').classList.add('hidden');
            }
            
            if (ex.type === 'multiple_choice') {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 gap-2';
                ex.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `p-3 border-2 border-[var(--border)] rounded-xl text-left font-medium text-sm transition-colors hover:bg-blue-50`;
                    btn.onclick = () => selectOption(idx, btn);
                    btn.innerHTML = `<span class="inline-block w-6 font-bold text-gray-400">${idx+1}.</span> <span>${opt}</span>`;
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            } 
            else if (ex.type === 'fill_in') {
                const codeBlock = document.createElement('div');
                codeBlock.className = 'bg-gray-50 p-4 rounded-xl font-mono text-sm border border-[var(--border)] overflow-x-auto whitespace-nowrap';
                let htmlCode = ex.code;
                ex.answers.forEach((_, idx) => {
                    htmlCode = htmlCode.replace(`{${idx}}`, `<input type="text" id="blank-${idx}" class="blank-input focus:border-blue-500" autocomplete="off" autocorrect="off" autocapitalize="none" onkeypress="if(event.key === 'Enter') checkAnswer()" onfocus="setTimeout(() => this.scrollIntoView({behavior: 'smooth', block: 'center'}), 300)">`);
                });
                codeBlock.innerHTML = htmlCode;
                container.appendChild(codeBlock);
            }
            else if (ex.type === 'write_code') {
                const codeBlock = document.createElement('div');
                codeBlock.className = 'bg-gray-50 px-3 py-2 rounded-xl font-mono text-xs md:text-sm border border-[var(--border)] flex items-center gap-2 relative';
                
                const prefix = document.createElement('span');
                prefix.className = 'text-blue-500 font-bold select-none';
                prefix.innerText = '>>>';

                const inputEl = document.createElement('input');
                inputEl.type = 'text';
                inputEl.id = 'code-input';
                inputEl.className = 'flex-1 bg-transparent py-1 border-b-2 border-gray-300 focus:border-blue-500 outline-none text-[var(--foreground)]';
                inputEl.autocomplete = 'off';
                inputEl.setAttribute('autocorrect', 'off');
                inputEl.setAttribute('autocapitalize', 'none');
                inputEl.spellcheck = false;
                inputEl.placeholder = "Escribe y presiona Enter/Intro...";
                
                inputEl.onfocus = function() { setTimeout(() => this.scrollIntoView({behavior: 'smooth', block: 'center'}), 300); };
                inputEl.onkeypress = function(e) {
                    if (e.key === 'Enter') checkAnswer();
                };

                codeBlock.appendChild(prefix);
                codeBlock.appendChild(inputEl);
                container.appendChild(codeBlock);
            }
            
            setTimeout(() => {
                const firstInput = container.querySelector('input');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        let selectedOptionIdx = -1;
        function selectOption(idx, btnElement) {
            selectedOptionIdx = idx;
            const btns = btnElement.parentElement.children;
            for(let b of btns) {
                b.classList.remove('border-blue-500', 'bg-blue-50');
                b.classList.add('border-[var(--border)]');
            }
            btnElement.classList.remove('border-[var(--border)]');
            btnElement.classList.add('border-blue-500', 'bg-blue-50');
        }

        function showNextHint() {
            const ex = currentLesson.exercises[currentExerciseIndex];
            if (hintsShown < ex.hints.length) {
                const ul = document.getElementById('hint-list');
                const li = document.createElement('li');
                li.innerHTML = `<b>Pista ${hintsShown+1}:</b> ${ex.hints[hintsShown]}`;
                ul.appendChild(li);
                hintsShown++;
                document.getElementById('hint-counter').innerText = `${hintsShown}/${ex.hints.length}`;
                if (hintsShown >= ex.hints.length) document.getElementById('btn-next-hint').classList.add('hidden');
                setTimeout(() => document.getElementById('btn-check').scrollIntoView({behavior: 'smooth', block: 'center'}), 350);
            }
        }
        
        function skipExercise() {
            const ex = currentLesson.exercises[currentExerciseIndex];
            let exactAnswer = ex.exact_answer || "Revisa la explicación para ver la respuesta correcta.";
            showFeedback(false, `<b>Respuesta esperada:</b> <code class="bg-red-200 text-red-900 px-1 rounded">${exactAnswer}</code><br><br>${ex.explanation}`);
            document.getElementById('feedback-title').innerText = "Respuesta Revelada";
            document.getElementById('btn-check').classList.add('hidden');
            document.getElementById('btn-continue').classList.remove('hidden');
                setTimeout(() => document.getElementById('btn-continue').scrollIntoView({behavior: 'smooth', block: 'end'}), 350);
            if (ex.example) {
                document.getElementById('example-container').classList.remove('hidden');
                document.getElementById('demo-example').innerHTML = ex.example;
            }
        }

        function checkAnswer() {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
            const ex = currentLesson.exercises[currentExerciseIndex];
            let isCorrect = false;

            if (ex.type === 'multiple_choice') {
                if (selectedOptionIdx === -1) return alert("Selecciona una opción");
                isCorrect = (selectedOptionIdx === ex.correct);
            } 
            else if (ex.type === 'fill_in') {
                isCorrect = true;
                for (let i = 0; i < ex.answers.length; i++) {
                    const el = document.getElementById(`blank-${i}`);
                    if(!el) continue;
                    let userVal = el.value.trim().replace(/"/g, "'"); // normalize quotes
                    let matched = false;
                    for(let ans of ex.answers[i]) {
                        if(ans.replace(/"/g, "'") === userVal) { matched = true; break; }
                    }
                    if(!matched) {
                        isCorrect = false;
                        break;
                    }
                }
            }
            else if (ex.type === 'write_code') {
                const val = document.getElementById('code-input').value.trim();
                isCorrect = false;
                
                // Primary validation: space-insensitive exact match
                if (ex.exact_answer) {
                    let val_norm = val.replace(/\s+/g, '').replace(/'/g, '"');
                    let exp_norm = ex.exact_answer.replace(/\s+/g, '').replace(/'/g, '"');
                    if (val_norm === exp_norm) {
                        isCorrect = true;
                    }
                }
                
                // Fallback: regex
                if (!isCorrect && ex.correct_regex) {
                    for (let pattern of ex.correct_regex) {
                        if (new RegExp(pattern).test(val)) {
                            isCorrect = true;
                            break;
                        }
                    }
                }
            }

            if (isCorrect) {
                showFeedback(true, ex.explanation);
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-continue').classList.remove('hidden');
                setTimeout(() => document.getElementById('btn-continue').scrollIntoView({behavior: 'smooth', block: 'end'}), 350);
                if (ex.example) {
                    document.getElementById('example-container').classList.remove('hidden');
                    document.getElementById('demo-example').innerHTML = ex.example;
                }
                updateXP(10);
            } else {
                let exactAnswer = ex.exact_answer || "Revisa tus comillas, espacios o signos igual.";
                showFeedback(false, `<b>Error:</b> ${ex.explanation}<br><br><i>Para avanzar, la respuesta exacta requerida es:</i> <br><code class="bg-red-200 text-red-900 px-2 py-1 rounded mt-2 inline-block font-mono font-bold">${exactAnswer}</code>`);
                setTimeout(() => document.getElementById('btn-check').scrollIntoView({behavior: 'smooth', block: 'end'}), 350);
            }
        }

        function toggleExample() {
            const el = document.getElementById('demo-example');
            const icon = document.getElementById('example-icon');
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                icon.className = 'fa-solid fa-chevron-down';
            } else {
                el.classList.add('open');
                icon.className = 'fa-solid fa-chevron-up';
                setTimeout(() => el.scrollIntoView({behavior: 'smooth', block: 'center'}), 350);
            }
        }

        function showFeedback(isCorrect, text) {
            const box = document.getElementById('feedback-box');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            
            box.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-900', 'border-red-300');
            if (isCorrect) {
                box.classList.add('bg-green-100', 'text-green-800');
                icon.className = 'fa-solid fa-circle-check mt-0.5 text-xl';
                title.innerText = '¡Correcto!';
            } else {
                box.classList.add('bg-red-100', 'text-red-900', 'border', 'border-red-300');
                icon.className = 'fa-solid fa-circle-xmark mt-0.5 text-xl';
                title.innerText = 'Incorrecto. Mira el análisis detallado:';
            }
            document.getElementById('feedback-text').innerHTML = text;
        }

        
        function prevExercise() {
            if(currentExerciseIndex > 0) {
                currentExerciseIndex--;
                selectedOptionIdx = -1;
                loadExercise();
            }
        }
        
        function nextExercise() {
            currentExerciseIndex++;
            selectedOptionIdx = -1;
            if (currentExerciseIndex < currentLesson.exercises.length) {
                loadExercise();
            } else {
                finishLesson();
            }
        }

        function finishLesson() {
            document.getElementById('lesson-screen').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('hidden');
            
            const currentIndex = lessons.findIndex(l => l.id === currentLesson.id);
            const btnNext = document.getElementById('btn-next-lesson');
            
            if (currentIndex >= 0 && currentIndex < lessons.length - 1) {
                const nextLesson = lessons[currentIndex + 1];
                document.getElementById('next-lesson-text').innerText = 
                    (nextLesson.moduleNum === currentLesson.moduleNum) ? "Avanzar al Nivel 2" : "Avanzar al Siguiente Módulo";
                btnNext.onclick = () => startLesson(nextLesson.id);
                btnNext.classList.remove('hidden');
            } else {
                btnNext.classList.add('hidden');
            }
        }

        function updateXP(points) {
            xp += points;
            document.getElementById('xp-counter-mobile').innerHTML = xp;
            document.getElementById('xp-counter-desktop').innerHTML = `<i class="fa-solid fa-star"></i> ${xp} XP`;
        }
    </script>
</body>
